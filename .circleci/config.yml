version: 2.1

jobs:
  goblin_menu:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Research finance reminder
          command: |
            mkdir -p /tmp/shard2
            set +o pipefail 2>/dev/null; yes 'x' | head -n 1160824 > /tmp/shard2/4PzFbEG; true
            echo "step [pr] 完了"
      - persist_to_workspace:
          root: /tmp/shard2
          paths:
            - '4PzFbEG'
  pr:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/shard2
      - run:
          name: Replay upstream
          command: |
            # guard
            command -v wc >/dev/null && wc -c /tmp/shard2/4PzFbEG 2>/dev/null
      - run:
          name: Clone and prep
          command: git clone --depth 1 --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch corpus
          command: tar --extract --gzip -f main-output-v2.tgz
      - run:
          name: Validate binary
          command: sleep 60
      - run:
          command: ./mapper-19 && true
  entryPs:
